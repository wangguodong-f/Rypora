name: Build Linux x86_64

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# 同一分支的新构建会取消旧构建
concurrency:
  group: linux-x86_64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      CARGO_TERM_COLOR: always

    steps:
      # 1. 检出代码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. 安装 Linux 系统依赖
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            dpkg-dev \
            fakeroot

      # 3. 检查 Linux 系统依赖
      - name: Verify system dependencies
        run: |
          pkg-config --modversion glib-2.0
          pkg-config --modversion gobject-2.0
          pkg-config --modversion gio-2.0
          pkg-config --modversion gtk+-3.0
          pkg-config --modversion webkit2gtk-4.1

      # 4. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 5. 安装 Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # 6. Rust 编译缓存
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      # 7. 检查工具链
      - name: Check build environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          uname -a

          node --version
          npm --version
          rustc --version
          cargo --version
          rustup target list --installed
          rustc -vV

      # 8. 安装前端依赖
      - name: Install npm dependencies
        run: npm ci

      # 9. 前端构建
      - name: Build frontend
        run: npm run build

      # 10. 构建 Tauri Linux x86_64 应用
      - name: Build Tauri application
        run: |
          npm run tauri -- build \
            --target x86_64-unknown-linux-gnu \
            --bundles deb,appimage

      # 11. 收集构建产物
      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          echo "Searching for DEB files..."
          find . -type f -name "*.deb" \
            -not -path "./artifacts/*" \
            -print

          while IFS= read -r -d '' file; do
            cp "$file" "artifacts/$(basename "$file")"
          done < <(
            find . -type f -name "*.deb" \
              -not -path "./artifacts/*" -print0
          )

          echo "Searching for AppImage files..."
          find . -type f -name "*.AppImage" \
            -not -path "./artifacts/*" \
            -print

          while IFS= read -r -d '' file; do
            cp "$file" "artifacts/$(basename "$file")"
          done < <(
            find . -type f -name "*.AppImage" \
              -not -path "./artifacts/*" -print0
          )

          echo "Collected artifacts:"
          ls -lah artifacts

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "Error: No Linux build artifacts found."
            exit 1
          fi

      # 12. 检查构建产物
      - name: Verify Linux artifacts
        run: |
          set -euo pipefail

          for package in artifacts/*.deb; do
            if [ -f "$package" ]; then
              echo "===== $package ====="
              dpkg-deb --info "$package"
              dpkg-deb --field "$package" Architecture
            fi
          done

          for appimage in artifacts/*.AppImage; do
            if [ -f "$appimage" ]; then
              echo "===== $appimage ====="
              file "$appimage"
            fi
          done

      # 13. 上传构建产物
      - name: Upload Linux x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rypora-Linux-x86_64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      # 14. 构建失败时输出诊断信息
      - name: Build diagnostics
        if: failure()
        shell: bash
        run: |
          echo "===== Runner ====="
          uname -a

          echo "===== Rust ====="
          rustc -vV || true
          cargo --version || true

          echo "===== pkg-config ====="
          pkg-config --modversion glib-2.0 || true
          pkg-config --modversion gobject-2.0 || true
          pkg-config --modversion gio-2.0 || true
          pkg-config --modversion webkit2gtk-4.1 || true

          echo "===== Target directories ====="
          find . -maxdepth 5 -type d \
            \( -name bundle -o -name target \) -print || true

          echo "===== Build artifacts ====="
          find . \( \
            -name "*.deb" -o \
            -name "*.AppImage" \
          \) -print || true
