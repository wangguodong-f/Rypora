[package]
name = "rypora"
version = "0.1.0"
description = "A Typora-like WYSIWYG Markdown editor"
authors = ["Rypora"]
license = "MIT"
edition = "2024"

[lib]
name = "rypora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
ignore = "0.4"
trash = "5"
thiserror = "2"
blake3 = "1"
